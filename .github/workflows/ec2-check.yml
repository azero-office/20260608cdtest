name: EC2 Website Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check EC2
        env:
          TARGET_URL: "http://13.209.50.127"
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          CURRENT_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          if curl -fsS --max-time 10 "$TARGET_URL" > /dev/null; then
            MESSAGE="✅ 정상 - EC2 접속 가능\nURL: $TARGET_URL\n시간: $CURRENT_TIME"
          else
            MESSAGE="🚨 장애 - EC2 접속 실패\nURL: $TARGET_URL\n시간: $CURRENT_TIME"
          fi

          curl -X POST "$TEAMS_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"$MESSAGE\"}"
